<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024">
  <!-- Holster: the edge tab and its column of app tiles, with the mint tile
       halfway out of its slot, being drawn. Centered on its full outline
       (tab stroke included). Master artwork for every icon size; regenerate
       with `pnpm app-icon`. -->
  <defs>
    <linearGradient id="tab" gradientUnits="userSpaceOnUse" x1="40" y1="30" x2="216" y2="226">
      <stop offset="0" stop-color="#B7A6F2"/>
      <stop offset="1" stop-color="#6FA6F0"/>
    </linearGradient>
    <linearGradient id="lavender" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#C9BCF7"/>
      <stop offset="1" stop-color="#9C89E8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#A9CEF6"/>
      <stop offset="1" stop-color="#6FA6E8"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#86E0BB"/>
      <stop offset="1" stop-color="#43BE8E"/>
    </linearGradient>
  </defs>
  <path d="M193 46 V210" stroke="url(#tab)" stroke-width="26" stroke-linecap="round"/>
  <rect x="102" y="30" width="64" height="60" rx="19" fill="url(#lavender)"/>
  <rect x="102" y="166" width="64" height="60" rx="19" fill="url(#sky)"/>
  <rect x="102" y="98" width="64" height="60" rx="19" fill="#9FB2F0" fill-opacity=".2"/>
  <rect x="50" y="98" width="64" height="60" rx="19" fill="url(#mint)"/>
  <rect x="50" y="98" width="64" height="28" rx="14" fill="#FFFFFF" fill-opacity=".2"/>
</svg>
