version: 2
updates:
  # Rust: Holster (src-tauri) and the hello-holster example share one Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  # The React front end (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
